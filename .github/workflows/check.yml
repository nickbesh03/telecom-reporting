name: Verify MVP
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: telecom_test
          MARIADB_USER: telecom
          MARIADB_PASSWORD: ci_demo_only
          MARIADB_ROOT_PASSWORD: ci_root_only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet test tests -c Release
      - run: dotnet test tests -c Release
        env:
          TEST_MARIADB: Server=127.0.0.1;Database=telecom_test;User=telecom;Password=ci_demo_only
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - run: cp .env.example .env && docker compose up -d --build --wait
      - run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/api/health
      - if: always()
        run: docker compose logs --tail 80
      - if: always()
        run: docker compose down
